name: Generate Royal Snake

on:
  schedule:
    # Runs automatically every 24 hours to update your commits
    - cron: "0 0 * * *" 
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  push:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Royal Gold Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # This is the God Mode math: Customizing the snake and dot colors
          outputs: |
            dist/royal-snake.svg?color_snake=#d4af37&color_dots=#1a1c23,#3d3310,#7a6620,#b89930,#d4af37
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
