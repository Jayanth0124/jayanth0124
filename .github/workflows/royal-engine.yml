name: Generate Royal Cyber-Worm

on:
  schedule:
    - cron: "0 0 * * *" 
  workflow_dispatch: 
  push:
    branches:
    - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create Dist Folder
        run: mkdir -p dist

      - name: Run Royal Snake Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Runs our custom, dependency-free script!
        run: node .github/scripts/royal-snake.js

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
